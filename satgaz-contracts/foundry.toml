[profile.default]
src           = "src"
out           = "out"
libs          = ["lib"]
solc          = "0.8.20"
optimizer         = true
optimizer_runs    = 200

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

# Etherscan / Blockscout verification
# Usage: forge script ... --verify --etherscan-api-key $ETHERSCAN_API_KEY --chain sepolia
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
